name: 단타 데이터 갱신

on:
  schedule:
    - cron: "*/5 0-6 * * 1-5"    # 평일 09:00~15:55 (한국시간) 5분마다
    - cron: "45 6 * * 1-5"       # 15:45 장 마감 최종 데이터
  workflow_dispatch:              # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scan.py
      - name: 데이터 저장
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "data $(date +%H:%M)"
          git pull --rebase
          git push
